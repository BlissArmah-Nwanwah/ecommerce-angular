<app-createproductmodal></app-createproductmodal>
<app-navbar></app-navbar>
<section class="main-section">
  <section class="image-section mb-5">
    <img
      class="full-width"
      src="../../../../assets/images/shop-hero-1-product-slide-1.png"
      alt=""
    />
    <div class="text-overlay">
      <div class="text-content">
        <p class="category">T-Shirt / Tops</p>
        <h1 class="title">Summer Value Pack</h1>
        <p class="description">cool / colorful /comfy</p>
        <button mat-raised-button color="accent">Shop Now</button>
      </div>
    </div>
  </section>

  <!-- Products section -->
  <section class="products-section">
    <div class="title-all-container">
      <div class="title-container">Products</div>
      @if (!loading()) {
        <app-custom-input-field
          label="Search"
          placeholder="Search Products"
          [control]="searchControl"
          type="text"
        ></app-custom-input-field>
      }
      <button
        mat-raised-button
        color="accent"
        (click)="onToggleCreatProductModal()"
      >
        Create Product
      </button>
    </div>
    <div class="content">
      @if (loading()) {
        <div class="loading-message">Loading...😎</div>
      }

      <div class="product-grid" #container>
        @for (product of filteredProducts(); track product.id) {
          <app-item-card
            #cardRef
            [product]="product"
            (productAction)="onProductAction($event)"
          ></app-item-card>
        }
      </div>
    </div>
  </section>
</section>
